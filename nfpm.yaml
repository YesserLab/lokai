# nfpm packaging manifest for LoKAI. Build all packages with `just package`, which sets $VERSION
# (from Cargo.toml) and $GLIBC (the newest glibc symbol version the binary uses); nfpm expands
# the ${...} references below from the environment.
name: lokai
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: "Yesser Labania <yesserlab@gmail.com>"
description: |
  LoKAI (lokale KI, local AI): a launcher-style chat client for AI models
  running on your own hardware, for KDE Plasma. It can also work on your machine:
  run shell commands and read, edit and search files, asking for your approval first.
vendor: "YesserLab"
homepage: "https://github.com/YesserLab/lokai"
license: "MIT"

# Runtime libraries are loaded with dlopen (EGL, Wayland, xkbcommon), so they are listed here
# by hand. The package names differ per distro: Debian/Ubuntu here, Fedora and Arch below.
depends:
  - libc6 (>= ${GLIBC})
  - libegl1
  - libwayland-client0
  - libwayland-egl1
  - libxkbcommon0
  - fontconfig
  - xdg-utils
recommends:
  - wl-clipboard # copied text survives the launcher closing
  - ripgrep # faster search_files
  - uv # creates the scratch Python environment and installs packages into it
  - python3-venv # fallback for the scratch Python environment without uv

contents:
  - src: target/release/lokai
    dst: /usr/bin/lokai
  - src: packaging/lokai.desktop
    dst: /usr/share/applications/lokai.desktop
  - src: assets/lokai.svg
    dst: /usr/share/icons/hicolor/scalable/apps/lokai.svg
  - src: README.md
    dst: /usr/share/doc/lokai/README.md
  - src: LICENSE
    dst: /usr/share/licenses/lokai/LICENSE
  - src: assets/lucide/LICENSE
    dst: /usr/share/licenses/lokai/LICENSE.lucide
  # latex-rust and the STIX Two Math font it embeds
  - src: packaging/licenses/NOTICE-latex-rust.txt
    dst: /usr/share/licenses/lokai/NOTICE.latex-rust
  - src: packaging/licenses/OFL-STIX-Two-Math.txt
    dst: /usr/share/licenses/lokai/OFL.stix-two-math

archlinux:
  packager: "Yesser Labania <yesserlab@gmail.com>"

overrides:
  rpm:
    depends:
      - glibc >= ${GLIBC}
      - libglvnd-egl
      - libwayland-client
      - libwayland-egl
      - libxkbcommon
      - fontconfig
      - xdg-utils
    recommends:
      - wl-clipboard
      - ripgrep
      - uv
      - python3
  archlinux:
    depends:
      - glibc>=${GLIBC}
      - libglvnd
      - wayland
      - libxkbcommon
      - fontconfig
      - xdg-utils
    recommends:
      - wl-clipboard
      - ripgrep
      - uv
      - python
