[package]
name = "lokai"
version = "1.2.0"
edition = "2024"
description = "LoKAI (lokale KI, local AI): launcher-style chat client for local AI models, with tools, for KDE Plasma"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "default_fonts", "clipboard", "links"] }
egui_commonmark = { version = "0.26", default-features = false }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
latex-rust = "3.0.3"
resvg = { version = "0.45.1", default-features = false }
ureq = { version = "3", default-features = false }
ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
